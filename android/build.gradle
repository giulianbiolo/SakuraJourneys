allprojects {
    repositories {
        google()
        mavenCentral()
    }
    subprojects {
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                }
            }
            // ? A plugin compiling with Java 8 source/target and -Werror turns JDK 21's
            // ? "source value 8 is obsolete" warning into a build failure. None of the
            // ? currently resolved plugins does (geolocator_android dropped it after
            // ? 3.2.1); this stays as a guard against one reappearing.
            project.tasks.withType(JavaCompile).configureEach {
                options.compilerArgs.removeAll { it == '-Werror' }
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
